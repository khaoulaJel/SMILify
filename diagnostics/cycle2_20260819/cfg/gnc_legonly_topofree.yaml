# Topology-robust version of gnc_legonly.yaml, following the user's follow-up request after
# B4's gnc_legonly FAILED on drop30/drop60 (face-index target split assumes template topology,
# violated by damage corpora -- see manifest.json's b4_gnc_legonly_damage entry).
# Only difference from gnc_legonly.yaml: robust_leg_only -> robust_leg_only_topofree (uses
# robust_chamfer_leg_split_topofree, see fitter_3d/trainer_moonshot.py). Same schedules,
# same everything else -- one variable changed.
stages:
  Stage_2_deform_coarse:
    scheme: all
    nits: 1000
    lr: 0.002
    n_sample: 6000
    edge_mode: shrink
    lr_decay: false
    robust_kernel: gm
    robust_leg_only_topofree: true
    robust_scale: 0.25
    robust_scale_end: 0.05
    loss_weights:
      w_chamfer: 1.0
      w_edge: 0.8
      w_normal: 0.005
      w_laplacian: 0.01
      w_offset: 5.0
      w_sym: 0.5
      w_beta_prior: 0.0
      w_midline: 2.0
      w_limit: 0.006
    custom_lrs:
      joint_rot: 0.002
  Stage_3_deform_fine:
    scheme: all
    nits: 1000
    lr: 0.0005
    n_sample: 6000
    edge_mode: shrink
    lr_decay: false
    robust_kernel: gm
    robust_leg_only_topofree: true
    robust_scale: 0.05
    robust_scale_end: 0.02
    loss_weights:
      w_chamfer: 0.5
      w_edge: 0.2
      w_normal: 0.002
      w_laplacian: 0.001
      w_offset: 2.0
      w_sym: 0.5
      w_beta_prior: 0.0
      w_midline: 2.0
      w_limit: 0.006
    custom_lrs:
      joint_rot: 0.002
args:
  results_dir: diagnostics/cycle2_20260819/runs/GNC_legonly_topofree
