# SMOKE TEST ONLY -- not a study arm. Tiny nits, 3 specimens, to confirm the
# newly-ported w_offset term in fitter_3d/trainer.py runs without error and
# actually moves deform_mag, before committing to a full bench50 sbatch run.
stages:
  Stage_0_init:
    scheme: 'init_rot_lock'
    nits: 5
    lr: 0.05

  Stage_1_default:
      scheme: 'default'
      nits: 5
      lr: 0.02
      loss_weights:
          w_chamfer: 1.
          w_edge: 0.8
          w_normal: 0.02
          w_laplacian: 0.01
          w_limit: 100.0
      custom_lrs:
        joint_rot: 0.002

  Stage_2_deform_coarse:
    scheme: 'all'
    nits: 10
    lr: 0.002
    loss_weights:
      w_chamfer: 1.
      w_edge: 0.8
      w_normal: 0.005
      w_laplacian: 0.01
      w_penetration: 0.02
      penetration_ramp_iters: 200
      w_limit: 100.0
      w_offset: 5.0

  Stage_3_deform_fine:
    scheme: 'all'
    nits: 10
    lr: 0.0005
    loss_weights:
      w_chamfer: 0.5
      w_edge: 0.2
      w_normal: 0.002
      w_laplacian: 0.001
      w_penetration: 0.05
      penetration_ramp_iters: 0
      w_limit: 100.0
      w_offset: 2.0

args:
  mesh_dir: diagnostics/khaoula_review/smoke_mesh_dir
  shape_family_id: -1
  results_dir: diagnostics/khaoula_review/smoke_offset
